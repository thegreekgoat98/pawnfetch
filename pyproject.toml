[project]
name = "pawnfetch"
version = "0.1.1"
description = "Fetch and compare chess.com player profiles and stats from the command line"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Chinmoy", email = "ranjanchinmoy@gmail.com" }
]
keywords = ["chess", "chess.com", "cli", "chess-stats"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "httpx>=0.28.1",
    "typer>=0.27.0",
    "rich>=15.0.0",
    "typing-extensions>=4.0",
]

[project.urls]
Homepage = "https://github.com/thegreekgoat98/pawnfetch"
Repository = "https://github.com/thegreekgoat98/pawnfetch"
Issues = "https://github.com/thegreekgoat98/pawnfetch/issues"

[project.scripts]
pawnfetch = "pawnfetch.cli:app"
pftch = "pawnfetch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pawnfetch"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENCE", "/pyproject.toml"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.9",
]
web = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn>=0.30",
]
