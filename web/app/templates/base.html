<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}pawnfetch — chess.com stats, fast{% endblock %}</title>
  <meta name="description" content="Look up and compare chess.com players: ratings, records, leaderboards and the daily puzzle.">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="{{ url_for('static', path='favicon.svg') }}" type="image/svg+xml">
  <script>try{var t=localStorage.getItem("pf-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}?v={{ asset_version('css/app.css') }}">
  <script src="{{ url_for('static', path='vendor/htmx.min.js') }}" defer></script>
  <script src="{{ url_for('static', path='js/app.js') }}?v={{ asset_version('js/app.js') }}" defer></script>
</head>
<body class="flex min-h-screen flex-col bg-bg font-sans text-ink antialiased">
  <header>
    <div class="mx-auto flex w-full max-w-6xl items-center justify-between px-5 py-4">
      <a href="/" class="flex items-center gap-2.5 text-xl font-black tracking-tight">
        <span class="grid size-9 place-items-center rounded-xl bg-accent text-accent-ink">
          <svg viewBox="0 0 24 24" class="size-6" fill="currentColor" aria-hidden="true"><circle cx="12" cy="7" r="3.6"/><path d="M9.2 11.5h5.6l-.9 3.2c1.6.7 2.9 2.3 3.2 4.3H6.9c.3-2 1.6-3.6 3.2-4.3z"/><rect x="5.5" y="19.5" width="13" height="2.5" rx="1.2"/></svg>
        </span>
        <span>pawn<span class="text-accent">fetch</span></span>
      </a>
      <div class="flex items-center gap-2">
        <a href="https://github.com/thegreekgoat98/pawnfetch" rel="noopener" class="rounded-xl px-3 py-2 text-sm font-semibold text-muted hover:text-ink">GitHub</a>
        <button type="button" data-theme-toggle aria-label="Toggle light and dark theme" class="grid size-10 place-items-center rounded-xl border-2 border-line bg-surface hover:border-accent">
          <svg class="theme-icon-sun size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="theme-icon-moon size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
    <div class="checker h-3" aria-hidden="true"></div>
  </header>

  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t-2 border-line">
    <div class="mx-auto flex w-full max-w-6xl flex-col gap-3 px-5 py-8 text-sm text-muted sm:flex-row sm:items-center sm:justify-between">
      <p>Data from the Chess.com Published-Data API. Not affiliated with Chess.com.</p>
      <p>Prefer the terminal? <code class="rounded-lg bg-surface-2 px-2 py-1 font-mono text-ink">pipx install pawnfetch</code></p>
    </div>
  </footer>
</body>
</html>
