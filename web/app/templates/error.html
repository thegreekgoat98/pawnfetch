{% extends "base.html" %}

{% block title %}{{ status_code }} — pawnfetch{% endblock %}

{% block content %}
<section class="mx-auto w-full max-w-3xl px-5 py-16 text-center">
  <p class="checker mx-auto inline-block rounded-3xl border-2 border-ink px-10 py-4 text-7xl font-black text-ink">{{ status_code }}</p>
  <h1 class="mt-8 text-3xl font-black tracking-tight">{{ heading }}</h1>
  <p class="mx-auto mt-3 max-w-md text-muted">{{ message }}</p>
  <a href="/" class="mt-8 inline-block rounded-xl bg-accent px-6 py-3 font-bold text-accent-ink">Back to search</a>
</section>
{% endblock %}
